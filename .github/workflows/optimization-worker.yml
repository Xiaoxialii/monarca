name: Optimization Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: optimization-worker
  cancel-in-progress: false

jobs:
  process-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process queued async jobs
        env:
          WORKER_SECRET: ${{ secrets.ASYNC_JOB_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "ASYNC_JOB_WORKER_SECRET is not configured."
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' \
            -X POST "https://www.monarcadata.com/api/internal/jobs/process" \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"limit":5}')"

          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"

          echo "$body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Worker endpoint failed with HTTP $status"
            exit 1
          fi
